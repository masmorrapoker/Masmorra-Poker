name: CI

# Roda em todo PR e em cada merge na master: testes dos cálculos e o mesmo build da Vercel.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  testes-e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
